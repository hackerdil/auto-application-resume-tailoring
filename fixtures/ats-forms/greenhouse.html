<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="ca-fixture-ats" content="greenhouse"><title>Senior Backend Engineer - Acme Fictional Ltd</title></head>
<body>
<h1>Senior Backend Engineer</h1>
<h2>Apply for this job</h2>
<form id="application-form" action="/submit" method="post">
  <p><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></p>
  <p><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></p>
  <p><label for="email">Email *</label><input id="email" name="email" type="email" required></p>
  <p><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></p>
  <p><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.docx" required></p>
  <p><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file" accept=".pdf,.docx"></p>
  <p><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin" type="url"></p>
  <p><label for="why">Why do you want to work at Acme Fictional Ltd?</label><textarea id="why" name="why"></textarea></p>
  <p><label for="auth">Are you legally authorized to work in the country where this job is located? *</label>
    <select id="auth" name="auth" required><option value="">Select...</option><option>Yes</option><option>No</option></select></p>
  <fieldset><legend>Will you now or in the future require sponsorship for employment visa status? *</legend>
    <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
  <h3>Voluntary Self-Identification</h3>
  <p><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select...</option><option>Female</option><option>Male</option><option>Non-binary</option><option>I don't wish to answer</option></select></p>
  <p><label for="veteran">Veteran Status</label><select id="veteran" name="veteran"><option value="">Select...</option><option>I am a protected veteran</option><option>I am not a protected veteran</option><option>I don't wish to answer</option></select></p>
  <p><label><input type="checkbox" id="privacy" name="privacy" required> I agree to the privacy policy *</label></p>
  <input type="text" name="website_hp" style="display:none" tabindex="-1" autocomplete="off">
  <button type="submit">Submit Application</button>
</form>
</body></html>
